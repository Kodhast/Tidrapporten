name: Plan

# Every PR must link an issue whose plan the owner has approved (label plan-godkänd),
# or say why it is a small change ("Liten ändring: <varför>"), see docs/beslut/0011. The check reads the labels live, so
# re-running it after the label is set is enough.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read

jobs:
  plan:
    name: Plan godkänd
    # Dependabot updates have no issue to plan in.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The check comes from the base branch, so a PR cannot loosen the check that judges it.
      # Only the PR that adds the check (base without it) runs its own copy.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .claude/hooks
      - name: Kontrollen finns på basen, annars PR:ens
        if: hashFiles('.claude/hooks/plan-approved.mjs') == ''
        uses: actions/checkout@v7
        with:
          sparse-checkout: .claude/hooks
      - run: node .claude/hooks/plan-approved.mjs --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
