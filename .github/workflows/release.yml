name: Release

# Started by hand from the Actions tab (issue 12). Deploys the version already on main to drift:
# Firestore rules and indexes in the drift project and Pages to the production branch
# (tid.kodhast.com), then tags it vX.Y.Z and publishes the CHANGELOG section as a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Provkör utan att driftsätta eller skapa taggen
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: drift
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 91ecbef25f1216be12523b34ba303639
      WRANGLER: wrangler@4.160.0
    steps:
      - name: Bara från main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::En release startas från main, inte från ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Version, tagg och versionshistorik
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag är redan släppt. Höj versionen i en PR först."
            exit 1
          fi
          awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md saknar rader under ## $version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          { echo "### $tag"; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: CI ska vara grön för den här committen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          if [ "$state" != "completed success" ]; then
            echo "::error::CI på main är inte grön för ${GITHUB_SHA::7} (${state:-ingen körning}). Vänta tills den är klar och grön."
            exit 1
          fi

      - run: npm ci
      - run: npm run build -- --mode drift

      - name: Pages-projektet finns
        run: bash scripts/pages-projekt.sh

      - name: Firestore-regler och index till driftprojektet
        env:
          KEY: ${{ secrets.FIREBASE_DEPLOY_DRIFT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-drift.json"
          printf '%s' "$KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          if [ "$DRY_RUN" = true ]; then
            npx firebase deploy --only firestore:rules,firestore:indexes --project drift --non-interactive --dry-run
          else
            npx firebase deploy --only firestore:rules,firestore:indexes --project drift --non-interactive
          fi

      - name: Publicera på tid.kodhast.com
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          npx --yes "$WRANGLER" pages deploy dist --project-name tidrapporten --branch produktion \
            --commit-hash "$GITHUB_SHA" --commit-message "$TAG"

      - name: Tagg och GitHub Release
        if: ${{ !inputs.dry_run }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
